name = "MOSS Image INT8 (16GB)"
script = "moss_image_train_network.py"
config = """
pretrained_model_name_or_path = "{{model:MODEL}}"
text_encoder = "{{clip:CLIP}}"
vae = "{{vae:VAE}}"
train_data_dir = "{{TRAIN_DIR}}"
output_dir = "{{OUTPUT_DIR}}"
output_name = "{{OUTPUT_NAME}}"
caption_extension = "{{CAPTION_EXTENSION}}"
resolution = "1024,1024"
enable_bucket = true
bucket_reso_steps = 64
min_bucket_reso = 256
max_bucket_reso = 2048
bucket_no_upscale = true
train_batch_size = 1
max_train_steps = 2000
learning_rate = 0.0001
optimizer_type = "AdamW8bit"
lr_scheduler = "constant"
network_module = "networks.lora_generic"
network_dim = 16
network_alpha = 16
network_train_unet_only = true
convrot_int8 = true
convrot_int8_text_encoder = true
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
timestep_sampling = "truncated_logit_normal"
logit_mean = -1.09
logit_std = 0.95
discrete_flow_shift = 1.0
mixed_precision = "bf16"
attn_mode = "torch"
max_data_loader_n_workers = 0
persistent_data_loader_workers = false
save_model_as = "safetensors"
save_precision = "bf16"
seed = 42
"""
